plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.mytv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.mytv.launcher'
        minSdk 21
        targetSdk 28   // старые ТВ-прошивки: без лишних ограничений новых Android
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ подписи: обновления ставятся поверх без удаления
    signingConfigs {
        mytv {
            storeFile file('mytv.keystore')
            storePassword 'mytv1234'
            keyAlias 'mytv'
            keyPassword 'mytv1234'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.mytv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
